name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Beichen
        uses: actions/checkout@v4
        with:
          repository: sophie8909/Beichen
          path: .beichen
          token: ${{ secrets.BEICHEN_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build main site
        run: npm run build

      - name: Run SEO tests
        run: npm run test:seo
        continue-on-error: true

      - name: Install Beichen dependencies
        working-directory: .beichen
        run: npm ci

      - name: Build Beichen
        working-directory: .beichen
        run: npm run build

      - name: Merge Beichen into Pages artifact
        run: |
          mkdir -p dist/assets dist/Beichen
          cp -R .beichen/dist/assets/. dist/assets/
          cp -R .beichen/dist/index.html dist/Beichen/
          cp -R .beichen/dist/rilu .beichen/dist/chenxun dist/Beichen/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
