name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout SXSTX Calculator
        uses: actions/checkout@v4
        with:
          repository: sophie8909/sxstx_calculator
          path: .sxstx
          ref: dead81ad0c0932849857f4e7d98131c08e6aae0d

      - name: Checkout Beichen
        id: checkout_beichen
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: sophie8909/Beichen
          path: .beichen
          ref: main
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build main site
        run: npm run build

      - name: Install Beichen dependencies
        if: steps.checkout_beichen.outcome == 'success'
        working-directory: .beichen
        run: npm ci

      - name: Build Beichen
        if: steps.checkout_beichen.outcome == 'success'
        working-directory: .beichen
        run: npm run build

      - name: Merge Beichen into Pages artifact
        if: steps.checkout_beichen.outcome == 'success'
        run: |
          mkdir -p dist/assets dist/Beichen
          cp -R .beichen/dist/assets/. dist/assets/
          cp -R .beichen/dist/index.html dist/Beichen/
          cp -R .beichen/dist/rilu .beichen/dist/chenxun dist/Beichen/

      - name: Build SXSTX Calculator
        working-directory: .sxstx
        run: |
          npm ci
          npm run build
          npm run test:seo

      - name: Assemble the calculator at the root URL
        run: node scripts/assemble-calculator.mjs .sxstx/dist

      - name: Apply AdSense tags to assembled child pages
        run: node scripts/inject-adsense-output.mjs

      - name: Run SEO tests
        env:
          SXSTX_ASSEMBLED: 1
        run: npm run test:seo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
